<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ringup</title>
    <style>
        :root {
            --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d8dee4; --accent: #1a73e8;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --line: #3c4043; --accent: #8ab4f8; }
        }
        body {
            margin: 0; padding: 14px 16px; width: 270px; background: var(--bg); color: var(--fg);
            font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        h1 { font-size: 14px; margin: 0 0 12px; }
        .stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin-bottom: 4px; }
        .stats dt { color: var(--muted); }
        .stats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
        hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
        label { display: flex; align-items: flex-start; gap: 8px; margin: 8px 0; cursor: pointer; }
        label input { margin: 2px 0 0; accent-color: var(--accent); }
        label small { display: block; color: var(--muted); }
        button {
            background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer;
        }
        .logs { display: flex; gap: 12px; align-items: baseline; margin-left: 21px; }
        .logs span { color: var(--muted); margin-left: auto; }
    </style>
</head>
<body>
    <h1>Ringup</h1>
    <dl class="stats">
        <dt>Reconnect clicks</dt><dd id="clicks">0</dd>
        <dt>Last reconnect</dt><dd id="clicksAt">never</dd>
        <dt>Page reloads</dt><dd id="reloads">0</dd>
    </dl>
    <button id="reset" type="button">Reset counters</button>
    <hr>
    <label>
        <input type="checkbox" id="autoReload">
        <span>Reload the page when stuck<small>If live video stopped for 5 minutes and did not come back</small></span>
    </label>
    <label>
        <input type="checkbox" id="darkMode">
        <span>Dark dashboard<small>Dark theme on the Ring dashboard page</small></span>
    </label>
    <label>
        <input type="checkbox" id="debug">
        <span>Debug logs<small>Shown in the Ring page's console (F12) and saved here, even across page reloads</small></span>
    </label>
    <div class="logs">
        <button id="copyLogs" type="button">Copy logs</button>
        <button id="clearLogs" type="button">Clear logs</button>
        <span id="logCount"></span>
    </div>
    <script src="popup.js"></script>
</body>
</html>
